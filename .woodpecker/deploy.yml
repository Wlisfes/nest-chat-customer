# Woodpecker CI 流水线 - 合并到 master 自动构建部署
# 触发条件: push 到 master 分支
# 流程: npm install -> vite build -> 复制到 nginx 卷 -> 验证

when:
  branch: master
  event: push

steps:
  - name: build
    image: node:20-alpine
    pull: true
    commands:
      - npm install --registry=https://registry.npmmirror.com
      - npx vite build
      - rm -rf /deploy/* 2>/dev/null || true
      - cp -r dist/* /deploy/

  - name: verify
    image: alpine
    commands:
      - ls -la /deploy/
      - echo "Deploy complete - nginx serving from volume"
