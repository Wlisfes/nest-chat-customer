apiVersion: v1
kind: Service
metadata:
  name: nest-chat-customer
  labels:
    app: nest-chat-customer
spec:
  type: LoadBalancer        # Docker Desktop 会将端口映射到 localhost
  selector:
    app: nest-chat-customer
  ports:
    - name: http
      port: 30080           # 宿主机 localhost:30080 可访问
      targetPort: 80
