name: Deploy to Docker Nginx

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npx vite build

      - name: Deploy to Docker Nginx
        shell: bash
        run: |
          echo "Cleaning old files..."
          docker exec nginx sh -c "rm -rf /usr/share/nginx/html/*"
          echo "Copying new build..."
          docker cp ./dist/. nginx:/usr/share/nginx/html/
          echo "Reloading Nginx..."
          docker exec nginx nginx -s reload
          echo "Deployed successfully to chat.lisfes.com"
